site_name: Penrose Cup
site_description: Official Competition Rulebook for EA SPORTS F1 26
site_url: https://penrose86.github.io/pcup/
repo_url: https://github.com/Penrose86/pcup
repo_name: Penrose86/pcup
theme:
  name: material
  language: en
  logo: assets/penrose-cup.png
  favicon: assets/penrose-cup.png
  palette:
    scheme: penrose
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
nav:
